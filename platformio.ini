; CamoBots: one codebase, role picked at build time.
;   pio run -e body -t upload        hider body
;   pio run -e blaster -t upload     seeker blaster / game host
;   *_sim envs swap sensors for serial commands (no extra parts needed)

[platformio]
default_envs = body, blaster

[esp]
platform = espressif32@6.11.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 115200  ; native USB ignores baud; avoids "No serial data received" on some hubs
monitor_filters = time

[env:body]
extends = esp
build_flags = -DROLE_BODY=1
build_src_filter = +<*> -<blaster/> -<bench/>

[env:blaster]
extends = esp
build_flags = -DROLE_BLASTER=1 -DSSD1306_NO_SPLASH
build_src_filter = +<*> -<body/> -<bench/>
lib_deps = adafruit/Adafruit SSD1306@2.5.13  ; optional 0.96" OLED, skipped if not wired
board_build.embed_txtfiles = web/index.html  ; the arcade page, served from flash

[env:body_sim]
extends = env:body
build_flags = ${env:body.build_flags} -DSIM=1

[env:blaster_sim]
extends = env:blaster
build_flags = ${env:blaster.build_flags} -DSIM=1

; Part tests, one per board: pio run -e bench_body -t upload, then open the serial monitor.
[env:bench_body]
extends = esp
build_flags = -DROLE_BODY=1
build_src_filter = +<hw.cpp> +<bench/>

[env:bench_blaster]
extends = esp
build_flags = -DROLE_BLASTER=1 -DSSD1306_NO_SPLASH
build_src_filter = +<hw.cpp> +<bench/>

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
